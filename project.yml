name: ShutoffMap
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.shutoffmap
    APP_STORE_ID: "6837842168"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  ShutoffMap:
    type: application
    platform: iOS
    sources: [ShutoffMap, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ShutoffMap AppStore
    info:
      path: ShutoffMap/Info.plist
      properties:
        CFBundleDisplayName: Shutoff Map
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        NSCameraUsageDescription: Take photos of your shutoff valves and breaker panel so you can find them in an emergency.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.shutoffmap.homecard
            UTTypeDescription: Home Emergency Card
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [homecard]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Home Emergency Card
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.shutoffmap.homecard]
        LSSupportsOpeningDocumentsInPlace: false
  ShutoffMapTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ShutoffMapTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  ShutoffMapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ShutoffMapUITests]
    dependencies:
      - target: ShutoffMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ShutoffMap
schemes:
  ShutoffMap:
    build:
      targets:
        ShutoffMap: all
        ShutoffMapTests: [test]
    test:
      config: Debug
      targets: [ShutoffMapTests]
  ShutoffMapUI:
    build:
      targets:
        ShutoffMap: all
        ShutoffMapUITests: [test]
    test:
      config: Debug
      targets: [ShutoffMapUITests]
